name: ThingsBoard TP CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  validate-and-launch:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:12
        env:
          POSTGRES_DB: thingsboard
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile Project
        run: mvn clean install -DskipTests -Dlicense.skip=true -B

      - name: Run Unit Tests
        run: mvn test -pl common,netty-mqtt -Dlicense.skip=true -B


      - name: Install DB Schema
        run: |
          chmod +x application/target/bin/install/install_dev_db.sh
          cd application/target
          cp ../src/main/resources/logback.xml .
          cp ../src/main/resources/thingsboard.yml .
          ./bin/install/install_dev_db.sh

      - name: Launch ThingsBoard
        run: |
          cd application/target
          nohup java -jar thingsboard-*.jar > tb.log 2>&1 &
          echo "ThingsBoard is starting..."

      - name: Verify Application is Running
        run: |
          echo "Waiting for ThingsBoard to start..."
          for i in {1..30}; do
            if curl -s -I http://localhost:8080/login | grep "HTTP/1.1 200\|HTTP/1.1 302"; then
              echo "SUCCESS: ThingsBoard is UP and responding!"
              exit 0
            fi
            echo "Still starting... ($i/30)"
            sleep 10
          done
          echo "FAILURE: ThingsBoard did not start in time."
          cat application/target/tb.log
          exit 1